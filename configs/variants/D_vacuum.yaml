# D_vacuum -- REFERENCE ONLY, NOT a delivered variant (R-49/R-50, 2026-07-12).
#
# Air is the baseline environment of the whole sensor family (R-49); this file
# exists so the vacuum numbers are not lost: it is the comparison point for the
# air-based D and the starting point of backlog M-13 (pressure-dependent
# Q_air(p)). It is NOT part of the A-D contract, is NOT in the resolved-variant
# golden, does NOT appear in the GUI variant list, and is NOT run by any
# acceptance example.
#
# READ BEFORE USING (O-SW-11):
#  1. `vacuum: true` in the current model is an IDEALIZATION -- it removes the
#     air channel entirely (Q_air = inf). Real rarefaction goes through three
#     Knudsen regimes; Q_air(p) is NOT modelled yet (M-13). For this cantilever
#     the air channel stops limiting Q only below p ~ 1.3 Pa (~1e-2 mbar); at
#     p ~ 100 Pa the answer would be ~9e3, neither 1472 nor 75 713.
#  2. With the air channel gone, Q is set entirely by the ANCHOR loss
#     Q_anchor = 2.17 (L/D)^3 = 99 232 -- and that coefficient (Hosaka 1995) is
#     strongly mounting-dependent and NOT MEASURED (bench, doc 20). The vacuum
#     numbers below are therefore order-of-magnitude estimates, not predictions.
#
# Model values in ideal vacuum at L = 4.47 mm (f1 = 5005 Hz), for comparison
# with the air-based D:
#
#              | air (D, delivered) | ideal vacuum (this file)
#   Q_total    | 1 472              | 75 713   (x51)
#   |D(f1)|    | 1 472              | 75 713
#   FS         | 22.16 mg           | 0.431 mg (FS ~ 1/Q)
#   NEA_th     | 0.227 ug/rtHz      | 0.032 ug/rtHz  (~32 ng/rtHz -- the "ng"
#              |                    |  of the retired doc 08 §6.3 framing)
#   peak width | 3.40 Hz            | 0.066 Hz (f1/Q -- needs f1 stability
#              |                    |  better than 13 ppm to stay in the band)
#   ring-up    | 0.094 s            | 4.82 s   (Q / (pi f1) -- response time)
#
# The last two rows are why vacuum is not a free lunch: a 0.066 Hz resonance is
# a metrology problem (thermal drift of f1 walks out of the band) and a ~5 s
# settling time is a design constraint, not a detail.
name: D_vacuum
description: REFERENCE ONLY -- vacuum counterpart of variant D (not delivered)
mode: resonance
line_freq_hz: 5000.0      # f_line = f1 (tuned), L = 4.47 mm
band:
  f_min_hz: 4750.0        # placeholder +/-5% bracket around the line (S0)
  f_max_hz: 5250.0
route: 1
eta_bias: 0.25
# Q: computed by the Q(L) model with the air channel removed -> 75 713
# (anchor 99 232 || structural 3.3e5 || TED 1e7). See the warning above.
q_total: null
full_scale_g: 4.31e-4     # FS = 13021 / (Q L^4[mm]) = 13021 / (75713 * 399.2) g
target_nea_ug_rthz: 0.032  # thermal floor at Q = 75 713 (doc 07 §2)
vacuum: true
source:
  preset: dfb               # 100 mW, RIN -155 dB/Hz
fiber:
  preset: smf28
cantilever:
  preset: silica
  overrides:
    length_m: 4.47e-3
reflector:
  preset: cyl_rc31          # R_c = 31 um, Delta x0 = 0.992 um (doc 08 §2 scaling)
detector:
  preset: balanced_24bit
  overrides:
    adc_full_scale: 1.3e-2  # unchanged: FS * Q is invariant, the swing is the same
