# Variant D -- resonant narrowband at the 5 kHz line (optional; doc 08 §6.2/§6.3).
# Composed form (S9-A). Since R-48 the quality factor is COMPUTED by the Q(L)
# damping model (air baseline, R-49): q_total: null -- see mechanics/damping.py.
# Differs from the common platform: DFB source + route 1 (AR endface), high
# power. Runs in AIR like every other variant (coordinator decision 2026-07-12,
# R-48/R-49: air is the baseline environment of the whole family; reduced
# pressure is out of scope -- backlog M-13). The band below is an S0 placeholder
# bracketing the line until doc 08 fixes it (transparent per the "no fudging"
# rule).
name: D
description: resonant narrowband at 5 kHz line (optional)
mode: resonance
line_freq_hz: 5000.0      # f_line = f1 (tuned), L = 4.47 mm
band:
  f_min_hz: 4750.0        # placeholder +/-5% bracket around the line (S0)
  f_max_hz: 5250.0
route: 1
eta_bias: 0.25
# Q_total: COMPUTED by the Q(L) model at L = 4.47 mm in AIR -> 1472 (Q_air 1501
# in parallel with anchor 99 232). Supersedes the tabulated 1500 (-1.9 %, the
# air-limited number of doc 08 §5, which the model reproduces). R-48.
q_total: null
# FS from the linearity-at-resonance constraint of doc 08 §5 (the binding one;
# strength gives 3.45 g, far looser): FS = 13021 / (Q L^4[mm]) g. With the model
# Q = 1472.03 at L = 4.47 mm this is 22.16 mg (the doc quotes 22 mg -- its
# 13021/(1500*399.2) = 21.7 mg rounded up). Recomputed, not rescaled: rescaling
# the rounded 22 mg by 1500/1472 would give 22.4 mg, a 1 % fudge (R-50).
# FS * Q = 13021/L^4 is Q-invariant by construction, so the resonant current
# swing (~9.5 mA) and hence adc_full_scale below do NOT move.
full_scale_g: 0.02216
# Target NEA = the thermal floor in AIR at this Q (doc 07 §2:
# NEA_th = sqrt(4 kB T omega1 / (Q M_a)), M_a = 0.58 rho S L): 0.227 ug/sqrt(Hz)
# at Q = 1472 (was 0.224 at Q = 1500). The old "toward ng in vacuum" framing is
# retired with the air baseline (R-49); the vacuum reference numbers are kept in
# variants/D_vacuum.yaml for comparison and for M-13. R-50.
target_nea_ug_rthz: 0.227
vacuum: false
source:
  preset: dfb               # 100 mW, RIN -155 dB/Hz
fiber:
  preset: smf28
cantilever:
  preset: silica
  overrides:
    length_m: 4.47e-3
reflector:
  preset: cyl_rc31          # R_c = 31 um, Delta x0 = 0.992 um (doc 08 §2 scaling)
detector:
  preset: balanced_24bit
  overrides:
    adc_full_scale: 1.3e-2  # +/- range, A (~1.3x the ~9.5 mA resonant FS swing)
