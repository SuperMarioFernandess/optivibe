# Variant A -- low-frequency, high-resolution (doc 08 §6.2/§6.3).
# Composed form (S9-A): subsystem presets + per-subsystem overrides. Since R-48
# the quality factor is COMPUTED by the Q(L) damping model (air baseline, R-49). Common optical platform R-40:
# lambda=1550 nm, rho=0.98, R=1 A/W, R1=0.036, route 2, eta0 bias ~0.25.
# Values are SI except named-unit fields (g, ug/sqrt(Hz), dB/Hz).
name: A
description: low-frequency high-resolution (0.1-100 Hz)
mode: offresonance
band:
  f_min_hz: 0.1
  f_max_hz: 100.0
full_scale_g: 5.0
route: 2
eta_bias: 0.25
# Q_total: COMPUTED by the Q(L) damping model at L = 5.0 mm in AIR
# (mechanics.damping; air + anchor + internal, docs 02 §5 / 07 §2.3) -> 1297.
# Supersedes the former hand-scaled 1430 (Q_air ~ 1/L over-estimated Q_air at
# low Re, -9.3 %); coordinator decision 2026-07-12, R-48. Set an explicit
# number here only to override the model.
q_total: null
target_nea_ug_rthz: 1.0   # target ~1 ug/sqrt(Hz) (NEA ~0.1-0.5 achievable)
vacuum: false
source:
  preset: sld
  overrides:
    power_w: 0.020          # 20 mW (range 20-50 mW); SLD default is 16 mW
fiber:
  preset: smf28
cantilever:
  preset: silica
  overrides:
    length_m: 5.0e-3        # L = 5.0 mm -> f1 ~ 4.0 kHz
reflector:
  preset: cyl_rc62          # R_c = 62.5 um, Delta x0 = 2.0 um (doc 03 §5)
detector:
  preset: balanced_24bit
  overrides:
    adc_full_scale: 5.0e-4  # +/- range, A (~1.3x the ~0.35 mA FS swing at 5 g)
