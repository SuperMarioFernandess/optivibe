# Role S-02 acceptance (doc 20 §5): analyze a recorded instrument output --
# a photocurrent capture plus the instrument config -> the 17 §1 metrics
# through the standard inverse chain, bypassing the forward model.
#
# The record examples/data/example_photocurrent.csv is a deterministic forward
# capture (variant B, sine 120 Hz @ 0.5 g, fs 5 kHz, photodiode, seed 42) with
# a paired reference-acceleration channel, standing in for a bench capture
# until real E-0/E-3 records exist (18 G5 fixtures land in tests/data/).
#
# Calibration source "bench": s_target is estimated from the paired reference
# channel (dsp.calibration.bench_sensitivity, ISO 16063-21 style) -- the path
# that works for ANY reflector shape (the "model" source stays cylinder-only,
# boundary G9, 18 §4.2).
#
# Run: optivibe analyze examples/analyze_record.yaml
# Expected dominant: 120.000 Hz.
kind: analyze
name: analyze-example-record
variant: B
record:
  format: csv
  path: examples/data/example_photocurrent.csv
  units: A
  column: i_pd_a
  time_column: time_s
  timestamp: "2026-07-04T00:00:00"
  reference:
    channel: a_ref_m_s2
    units: m/s^2
calibration:
  source: bench
  note: example record; reference channel generated by the same forward run
